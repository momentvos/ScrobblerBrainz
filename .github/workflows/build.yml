name: Build ScrobblerBrainz

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore ScrobblerBrainz.sln

      - name: Build Release
        run: msbuild ScrobblerBrainz.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Package DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "bin\Release\mb_ScrobblerBrainz.dll" -Destination "dist\"
          Copy-Item "bin\Release\TagLibSharp.dll" -Destination "dist\"

      - name: Upload compiled plugin
        uses: actions/upload-artifact@v4
        with:
          name: mb_ScrobblerBrainz
          path: dist/*
